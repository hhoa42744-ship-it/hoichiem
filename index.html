<title>Hoa thân gửi 💗 | 20/10</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #ffe0ed, #fff0f5, #e9ddff);
    color: #78334e;
    text-align: center;
    overflow-x: hidden;
}

.container {
    width: 92%;
    max-width: 760px;
    margin: 30px auto;
    padding: 28px 20px;
    background: rgba(255,255,255,.9);
    border: 2px solid white;
    border-radius: 28px;
    box-shadow: 0 12px 40px rgba(211,105,145,.18);
    position: relative;
    z-index: 1;
}

h1 {
    color: #e74785;
    font-size: clamp(28px, 6vw, 43px);
}

.subtitle {
    color: #a65d7b;
    line-height: 1.8;
    margin-bottom: 25px;
}

.big-heart {
    font-size: 55px;
    animation: heartbeat 1.4s infinite;
}

@keyframes heartbeat {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.15); }
}

.names {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    max-width: 500px;
    margin: 25px auto;
}

.name-btn {
    padding: 16px 8px;
    border: 2px solid #ffc2d8;
    border-radius: 18px;
    background: white;
    color: #d9417b;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: .25s;
}

.name-btn:hover, .name-btn.active {
    background: linear-gradient(135deg,#ff79ad,#e74785);
    color: white;
    transform: translateY(-3px);
    box-shadow: 0 7px 15px #f6b5d0;
}

.message-card {
    display: none;
    margin-top: 25px;
    padding: 25px 18px;
    background: linear-gradient(145deg,#fff6fa,#fff);
    border: 1px solid #ffd2e3;
    border-radius: 22px;
}

.message-card.show {
    display: block;
    animation: appear .5s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

.person-icon { font-size: 60px; }

.message-card h2 {
    color: #e74785;
    font-size: 27px;
}

.message {
    font-size: 17px;
    line-height: 1.9;
    white-space: pre-line;
}

.gift-btn {
    margin-top: 18px;
    padding: 14px 25px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(135deg,#ff639e,#e73778);
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 15px #f3b1cc;
}

.gift-btn:hover { transform: scale(1.04); }

.back-btn {
    display: block;
    margin: 18px auto 0;
    padding: 12px 22px;
    border: 2px solid #ffb5d0;
    border-radius: 25px;
    background: white;
    color: #d9417b;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.back-btn:hover { background: #ffe0ed; }

.gift-box {
    display: none;
    margin-top: 22px;
    padding: 20px 12px;
    background: #fff0f6;
    border-radius: 18px;
}

.gift-box.show {
    display: block;
    animation: appear .6s ease;
}

.gift-art {
    width: 100%;
    max-width: 390px;
    margin: 0 auto 15px;
}

.gift-art svg {
    display: block;
    width: 100%;
    height: auto;
    filter: drop-shadow(0 8px 10px rgba(150,70,110,.13));
}

.gift-title {
    color: #db3d7a;
    font-size: 22px;
    font-weight: bold;
}

.footer {
    margin-top: 28px;
    font-size: 14px;
    line-height: 1.8;
    color: #b76b8b;
}

.floating {
    position: fixed;
    top: -30px;
    z-index: 0;
    pointer-events: none;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(360deg);
        opacity: .2;
    }
}

#confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
}

@media(max-width:400px) {
    .container { padding: 22px 12px; }
    .name-btn { font-size: 16px; }
}
</style>

        btn.classList.remove("active");
    });

    button.classList.add("active");

    document.getElementById("personIcon").textContent = girl.icon;
    document.getElementById("personName").textContent =
        "Hoa thân gửi " + name + " 💌";

    document.getElementById("personMessage").textContent =
        girl.message;

    document.getElementById("backBtn").textContent =
        "⬅ Hoa thân gửi " + name;

    document.getElementById("giftBox").classList.remove("show");

    const card = document.getElementById("messageCard");
    card.classList.remove("show");
    void card.offsetWidth;
    card.classList.add("show");

    card.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
    });

    burstConfetti();
}

function openGift() {
    if (!selectedGirl) return;

    const girl = girls[selectedGirl];

    document.getElementById("giftArt").innerHTML = girl.art;
    document.getElementById("giftTitle").textContent =
        girl.giftTitle;

    document.getElementById("giftMessage").textContent =
        girl.giftMessage;

    const giftBox = document.getElementById("giftBox");
    giftBox.classList.remove("show");
    void giftBox.offsetWidth;
    giftBox.classList.add("show");

    giftBox.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
    });

    burstConfetti();
}

function goBack() {
    document.getElementById("messageCard").classList.remove("show");
    document.getElementById("giftBox").classList.remove("show");

    document.querySelectorAll(".name-btn").forEach(btn => {
        btn.classList.remove("active");
    });

    selectedGirl = null;

    document.querySelector(".names").scrollIntoView({
        behavior: "smooth",
        block: "center"
    });
}

// Hoa và trái tim rơi
function createFloating() {
    const el = document.createElement("div");
    const items = ["🌸", "💗", "🌷", "💕", "✨", "🌹"];

    el.className = "floating";
    el.textContent = items[Math.floor(Math.random() * items.length)];
    el.style.left = Math.random() * 100 + "vw";
    el.style.fontSize = (14 + Math.random() * 17) + "px";
    el.style.animationDuration = (5 + Math.random() * 6) + "s";

    document.body.appendChild(el);
    setTimeout(() => el.remove(), 11000);
}

setInterval(createFloating, 500);

// Hiệu ứng giấy màu
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");

let particles = [];
let animationRunning = false;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function burstConfetti() {
    for (let i = 0; i < 75; i++) {
        particles.push({
            x: window.innerWidth / 2,
            y: window.innerHeight * 0.35,
            vx: (Math.random() - 0.5) * 12,
            vy: Math.random() * -10 - 2,
            gravity: 0.22,
            size: Math.random() * 7 + 3,
            color: [
                "#ff5c9d", "#ffd166", "#c77dff",
                "#ff85a1", "#8bd3dd"
            ][Math.floor(Math.random() * 5)],
            life: 100
        });
    }

    if (!animationRunning) {
        animationRunning = true;
        animateConfetti();
    }
}

function animateConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.life--;

        ctx.globalAlpha = Math.max(0, p.life / 100);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    });

    ctx.globalAlpha = 1;
    particles = particles.filter(p => p.life > 0);

    if (particles.length > 0) {
        requestAnimationFrame(animateConfetti);
    } else {
        animationRunning = false;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
}
</script>
